name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    name: Lint, format & test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (core + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check src tests scripts config

      - name: Black (format check)
        run: black --check src tests scripts config

      - name: Pytest
        run: pytest -q --maxfail=1

      - name: Pipeline smoke test (end-to-end, SQLite)
        run: python -m src.pipeline

      - name: Glossary is in sync with the registry
        run: |
          python scripts/generate_glossary.py
          git diff --exit-code docs/FEATURE_GLOSSARY.md \
            || (echo "FEATURE_GLOSSARY.md is stale; run scripts/generate_glossary.py" && exit 1)
